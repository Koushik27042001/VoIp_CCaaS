; VoIP CCaaS — PJSIP endpoints for browser WebRTC + agent extensions
; Mounted into /etc/asterisk/pjsip.conf by docker-compose

[global]
type=global
; Ensure REGISTER over WS is matched by auth username first.
endpoint_identifier_order=auth_username,username,ip,anonymous

; Local dev does not require WSS transport or cert files.
; Uncomment this block only when you deploy behind HTTPS with valid certs.
;[transport-wss]
;type=transport
;protocol=wss
;bind=0.0.0.0:8089
;cert_file=/etc/asterisk/keys/asterisk.pem
;priv_key_file=/etc/asterisk/keys/asterisk.key

[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0:8088

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; Agent extension 1001
[1001]
type=endpoint
context=from-internal
identify_by=auth_username,username
disallow=all
allow=opus,ulaw,alaw
auth=1001-auth
aors=1001-aor
webrtc=yes
dtls_auto_generate_cert=yes
media_encryption=dtls
transport=transport-ws

[1001-auth]
type=auth
auth_type=userpass
realm=asterisk
password=agent1001pass
username=1001

[1001-aor]
type=aor
max_contacts=5

; Agent extension 1002
[1002]
type=endpoint
context=from-internal
identify_by=auth_username,username
disallow=all
allow=opus,ulaw,alaw
auth=1002-auth
aors=1002-aor
webrtc=yes
dtls_auto_generate_cert=yes
media_encryption=dtls
transport=transport-ws

[1002-auth]
type=auth
auth_type=userpass
realm=asterisk
password=agent1002pass
username=1002

[1002-aor]
type=aor
max_contacts=5

; Trunks generated by SIP Trunk settings UI
#include pjsip_custom.conf
