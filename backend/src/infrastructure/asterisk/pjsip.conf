; VoIP CCaaS — PJSIP endpoints for browser WebRTC + agent extensions
; Mount into /etc/asterisk/pjsip.conf or include from main pjsip.conf

[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:8089
cert_file=/etc/asterisk/keys/asterisk.pem
priv_key_file=/etc/asterisk/keys/asterisk.key

[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0:8088

; Agent extension 1001
[1001]
type=endpoint
context=from-internal
disallow=all
allow=opus,ulaw,alaw
auth=1001-auth
aors=1001-aor
webrtc=yes
dtls_auto_generate_cert=yes
media_encryption=dtls
transport=transport-ws

[1001-auth]
type=auth
auth_type=userpass
password=agent1001pass
username=1001

[1001-aor]
type=aor
max_contacts=5

; Agent extension 1002
[1002]
type=endpoint
context=from-internal
disallow=all
allow=opus,ulaw,alaw
auth=1002-auth
aors=1002-aor
webrtc=yes
dtls_auto_generate_cert=yes
media_encryption=dtls
transport=transport-ws

[1002-auth]
type=auth
auth_type=userpass
password=agent1002pass
username=1002

[1002-aor]
type=aor
max_contacts=5
