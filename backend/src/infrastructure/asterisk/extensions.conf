; VoIP CCaaS dialplan

[general]
static=yes
writeprotect=no

[from-internal]
; Extension-to-extension: 1001 calls 1002
exten => _10XX,1,NoOp(Internal call to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

; Outbound PSTN via trunk (configure PJSIP trunk peer "pstn-trunk")
[outbound-mobile]
exten => _X.,1,NoOp(Outbound mobile ${EXTEN} CALL_ID=${CALL_ID})
 same => n,Dial(PJSIP/${EXTEN}@pstn-trunk,60)
 same => n,Hangup()
