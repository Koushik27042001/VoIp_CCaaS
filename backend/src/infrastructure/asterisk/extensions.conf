; VoIP CCaaS dialplan

[general]
static=yes
writeprotect=no

[from-internal]
; Extension-to-extension: 1001 calls 1002
exten => _10XX,1,NoOp(Internal call to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

; Outbound trunk routing is generated from SIP trunk records.
#include extensions_custom.conf
